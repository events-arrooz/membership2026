<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arroz Estúdios — Membros</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" onerror="this.remove()">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --arroz-blue: #3d8ef0;
    --arroz-blue-dark: #2b6fd4;
    --arroz-blue-light: #e8f1fd;
    --arroz-blue-pale: #f0f6ff;
    --white: #ffffff;
    --text: #1a1a2e;
    --text-light: #5a6a8a;
    --border: #d0dff5;
    --bg: #f4f7fc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Barlow", "Gill Sans", "Gill Sans MT", "Roboto", -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--arroz-blue);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    box-shadow: 0 2px 12px rgba(61,142,240,0.3);
  }

  .header-logo {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: white;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }

  .header-logo span {
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    opacity: 0.85;
  }

  .connection-badge {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.15);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
  }

  .stat-box {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1rem;
    text-align: center;
    box-shadow: 0 2px 8px rgba(61,142,240,0.06);
  }

  .stat-box .number {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--arroz-blue);
    letter-spacing: -0.02em;
  }

  .stat-box .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-light);
    margin-top: 0.2rem;
    font-weight: 500;
  }

  .tabs {
    display: flex;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(61,142,240,0.06);
  }

  .tab {
    flex: 1;
    padding: 0.85rem;
    text-align: center;
    cursor: pointer;
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text-light);
    border: none;
    transition: all 0.2s;
  }

  .tab:not(:last-child) { border-right: 1.5px solid var(--border); }
  .tab.active { background: var(--arroz-blue); color: white; }
  .tab:hover:not(.active) { background: var(--arroz-blue-light); color: var(--arroz-blue); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(61,142,240,0.07);
  }

  .card h2 {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--arroz-blue);
    margin-bottom: 1.5rem;
    padding-bottom: 0.8rem;
    border-bottom: 2px solid var(--arroz-blue-light);
  }

  .form-group { margin-bottom: 1.2rem; }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
    color: var(--text-light);
  }

  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: "Barlow", "Gill Sans", "Gill Sans MT", "Roboto", -apple-system, system-ui, sans-serif;
    font-size: 1rem;
    background: var(--white);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }

  input:focus {
    outline: none;
    border-color: var(--arroz-blue);
    box-shadow: 0 0 0 3px rgba(61,142,240,0.12);
  }

  .radio-group { display: flex; gap: 0.8rem; }

  .radio-option {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    background: white;
    font-family: "Barlow", "Gill Sans", "Gill Sans MT", "Roboto", -apple-system, system-ui, sans-serif;
  }

  .radio-option input { display: none; }
  .radio-option strong { display: block; font-size: 1rem; }

  .radio-option .badge {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.25rem;
    opacity: 0.75;
  }

  .radio-option.selected-anual {
    background: var(--arroz-blue);
    color: white;
    border-color: var(--arroz-blue);
    box-shadow: 0 4px 12px rgba(61,142,240,0.3);
  }

  .radio-option.selected-diario {
    background: #1a56c4;
    color: white;
    border-color: #1a56c4;
    box-shadow: 0 4px 12px rgba(26,86,196,0.3);
  }

  .btn {
    width: 100%;
    padding: 0.9rem;
    border: none;
    border-radius: 8px;
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
    -webkit-appearance: none;
  }

  .btn-primary {
    background: var(--arroz-blue);
    color: white;
    box-shadow: 0 4px 12px rgba(61,142,240,0.3);
  }

  .btn-primary:hover { background: var(--arroz-blue-dark); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .alert {
    padding: 0.85rem 1rem;
    border-radius: 8px;
    margin-bottom: 1.2rem;
    font-size: 0.9rem;
    display: none;
    border-left: 4px solid;
  }

  .alert-success { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
  .alert-error { background: #fdecea; border-color: #f44336; color: #c62828; }
  .alert-info { background: var(--arroz-blue-light); border-color: var(--arroz-blue); color: var(--arroz-blue-dark); }
  .alert.show { display: block; }

  .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .search-bar input { flex: 1; }

  .filter-btns { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }

  .filter-btn {
    padding: 0.4rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    background: white;
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    color: var(--text-light);
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: var(--arroz-blue);
    color: white;
    border-color: var(--arroz-blue);
  }

  .filter-btn:hover:not(.active) {
    border-color: var(--arroz-blue);
    color: var(--arroz-blue);
  }

  .stat-box-full {
    background: var(--arroz-blue);
    border-radius: 12px;
    padding: 1.2rem 1rem;
    text-align: center;
    box-shadow: 0 2px 8px rgba(61,142,240,0.2);
  }

  .stat-box-full .number {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: white;
    letter-spacing: -0.02em;
  }

  .stat-box-full .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.8);
    margin-top: 0.2rem;
    font-weight: 500;
  }

  .member-count { font-size: 0.82rem; color: var(--text-light); margin-bottom: 0.8rem; }

  .member-card {
    background: var(--arroz-blue-pale);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .member-card:hover {
    border-color: var(--arroz-blue);
    box-shadow: 0 2px 8px rgba(61,142,240,0.12);
  }

  .member-info h4 {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 0.15rem;
    color: var(--text);
  }

  .member-info p { font-size: 0.82rem; color: var(--text-light); }
  .member-info small { font-size: 0.72rem; color: #aaa; }

  .tag {
    display: inline-block;
    padding: 0.28rem 0.75rem;
    border-radius: 20px;
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .tag-anual { background: var(--arroz-blue); color: white; }
  .tag-diario { background: #1a56c4; color: white; }

  .empty-state {
    text-align: center;
    padding: 2.5rem;
    color: #bbb;
  }

  .empty-state span { display: block; font-size: 2.5rem; margin-bottom: 0.8rem; }

  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--text-light);
    font-size: 0.9rem;
  }

  .search-result-card {
    background: var(--arroz-blue-pale);
    border: 1.5px solid var(--arroz-blue);
    border-radius: 10px;
    padding: 1.2rem;
    margin-top: 1rem;
  }

  .search-result-card h4 {
    font-family: "Barlow Condensed", "Gill Sans Nova Cond", "Gill Sans MT Condensed", "Gill Sans", "Roboto Condensed", "Arial Narrow", sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
    color: var(--text);
  }

  .entries-list { margin-top: 0.8rem; }

  .entries-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 0.4rem;
  }

  .entry-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    padding: 0.25rem 0;
    border-bottom: 1px dashed var(--border);
    color: var(--text-light);
  }

  .disclaimer {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-top: 0.8rem;
    line-height: 1.4;
  }

  @media (max-width: 768px) {
    header { padding: 0 1.2rem; height: 62px; }
    header img { height: 38px; }
    .container { padding: 1.2rem 1rem; }
    .stats { gap: 0.6rem; }
    .stat-box .number { font-size: 1.7rem; }
    .card { padding: 1.4rem 1.1rem; }
    .tab { font-size: 0.8rem; padding: 0.75rem 0.4rem; }
  }
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//Z"></div>

</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('registar')">Registar</button>
    <button class="tab" onclick="switchTab('pesquisar')">Pesquisar</button>
    <button class="tab" onclick="switchTab('lista')">Lista</button>
  </div>

  <div id="panel-registar" class="panel active">
    <div class="card">
      <h2>Novo Registo</h2>
      <div id="alert-reg" class="alert"></div>
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="reg-nome" placeholder="Nome do membro" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@exemplo.com" autocomplete="off" autocapitalize="none">
      </div>
      <div class="form-group">
        <label>Tipo de Membership</label>
        <div class="radio-group">
          <label class="radio-option" id="opt-anual" onclick="selectTipo('anual')">
            <input type="radio" name="tipo" value="anual">
            <strong>Anual</strong>
            <span class="badge">Sócio do ano</span>
          </label>
          <label class="radio-option" id="opt-diario" onclick="selectTipo('diario')">
            <input type="radio" name="tipo" value="diario">
            <strong>Diário</strong>
            <span class="badge">Entrada do dia</span>
          </label>
        </div>
      </div>
      <button class="btn btn-primary" onclick="registarMembro()">Registar Membro</button>
      <p class="disclaimer">* Ao registares-te, aceitas receber comunicações e newsletters do Arroz Estúdios via email.</p>
    </div>
  </div>

  <div id="panel-pesquisar" class="panel">
    <div class="card">
      <h2>Pesquisar por Email</h2>
      <div id="alert-search" class="alert"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="search-email" placeholder="email@exemplo.com" autocapitalize="none" onkeydown="if(event.key==='Enter') pesquisar()">
      </div>
      <button class="btn btn-primary" onclick="pesquisar()">Pesquisar</button>
      <div id="search-result"></div>
    </div>
  </div>

  <div id="panel-lista" class="panel">
    <div class="card">
      <h2>Todos os Membros</h2>

      <div class="stats" style="margin-bottom:1rem;">
        <div class="stat-box">
          <div class="number" id="stat-total">—</div>
          <div class="label">Total do Dia</div>
        </div>
        <div class="stat-box">
          <div class="number" id="stat-anual">—</div>
          <div class="label">Anuais Hoje</div>
        </div>
        <div class="stat-box">
          <div class="number" id="stat-diario">—</div>
          <div class="label">Diários Hoje</div>
        </div>
      </div>

      <div class="stat-box-full" style="margin-bottom:1.5rem;">
        <div class="number" id="stat-anual-total">—</div>
        <div class="label">Total de Membros Anuais</div>
      </div>
      <div class="search-bar">
        <input type="text" id="filter-input" placeholder="Filtrar por nome ou email..." oninput="renderLista()">
      </div>
      <div class="filter-btns">
        <button class="filter-btn active" id="fbtn-todos" onclick="setFilter('todos')">Todos</button>
        <button class="filter-btn" id="fbtn-anual" onclick="setFilter('anual')">Anuais</button>
        <button class="filter-btn" id="fbtn-diario" onclick="setFilter('diario')">Diários</button>
      </div>
      <div class="member-count" id="member-count"></div>
      <div id="members-list"><div class="loading">A carregar...</div></div>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://qwigxxdvcmxazigmkykn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3aWd4eGR2Y214YXppZ21reWtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1ODM0MDEsImV4cCI6MjA4NzE1OTQwMX0.n3AaEiUw2vliVTajVAQGKXGcyqfO-sXVzfHJz72BpPc';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let tipoSelected = null;
  let filterTipo = 'todos';
  let allMembers = [];

  async function init() {
    try {
      document.getElementById('connection-status').textContent = 'Ligado ✓';
    } catch(e) {
      document.getElementById('connection-status').textContent = 'Erro de ligação';
    }
  }

  function todayStr() { return new Date().toISOString().split('T')[0]; }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function selectTipo(tipo) {
    tipoSelected = tipo;
    document.getElementById('opt-anual').className = 'radio-option' + (tipo === 'anual' ? ' selected-anual' : '');
    document.getElementById('opt-diario').className = 'radio-option' + (tipo === 'diario' ? ' selected-diario' : '');
  }

  function switchTab(tab) {
    const tabs = ['registar', 'pesquisar', 'lista'];
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', tabs[i] === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    if (tab === 'lista') loadAndRenderLista();
  }

  function showAlert(id, type, msg) {
    const el = document.getElementById(id);
    el.className = 'alert alert-' + type + ' show';
    el.textContent = msg;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 6000);
  }

  async function loadStats() {
    const hoje = todayStr();
    const { count: anualTotal } = await db.from('membros').select('*', { count: 'exact', head: true }).eq('tipo', 'anual');
    const { count: anualHoje } = await db.from('membros').select('*', { count: 'exact', head: true }).eq('tipo', 'anual').gte('ultima_entrada', hoje + 'T00:00:00').lte('ultima_entrada', hoje + 'T23:59:59');
    const { count: diarioHoje } = await db.from('membros').select('*', { count: 'exact', head: true }).eq('tipo', 'diario').gte('ultima_entrada', hoje + 'T00:00:00').lte('ultima_entrada', hoje + 'T23:59:59');
    const totalHoje = (anualHoje ?? 0) + (diarioHoje ?? 0);
    document.getElementById('stat-total').textContent = totalHoje;
    document.getElementById('stat-anual').textContent = anualHoje ?? 0;
    document.getElementById('stat-diario').textContent = diarioHoje ?? 0;
    document.getElementById('stat-anual-total').textContent = anualTotal ?? 0;
  }

  async function registarMembro() {
    const nome = document.getElementById('reg-nome').value.trim();
    const email = document.getElementById('reg-email').value.trim().toLowerCase();
    const tipo = tipoSelected;

    if (!nome) return showAlert('alert-reg', 'error', 'Por favor insere o nome.');
    if (!email || !email.includes('@')) return showAlert('alert-reg', 'error', 'Por favor insere um email válido.');
    if (!tipo) return showAlert('alert-reg', 'error', 'Por favor seleciona o tipo de membership.');

    const hoje = todayStr();
    const { data: existentes } = await db.from('membros').select('*').eq('email', email).eq('tipo', tipo);

    if (tipo === 'anual') {
      if (existentes && existentes.length > 0) {
        const m = existentes[0];
        return showAlert('alert-reg', 'error', 'Este email ja esta registado como membro anual desde ' + formatDate(m.primeira_entrada) + '.');
      }
    } else {
      if (existentes && existentes.length > 0) {
        const m = existentes[0];
        const ultimaData = m.ultima_entrada?.split('T')[0];
        if (ultimaData === hoje) {
          return showAlert('alert-reg', 'error', m.nome + ' ja tem uma entrada diaria registada para hoje.');
        }
        const { error } = await db.from('membros').update({ entradas: m.entradas + 1, ultima_entrada: new Date().toISOString() }).eq('id', m.id);
        if (error) return showAlert('alert-reg', 'error', 'Erro ao registar. Tenta novamente: ' + error.message);
        limparFormulario();
        loadStats();
        return showAlert('alert-reg', 'success', 'Nova entrada diaria registada para ' + m.nome + '!');
      }
    }

    const agora = new Date().toISOString();
    const { error } = await db.from('membros').insert({ nome, email, tipo, entradas: 1, primeira_entrada: agora, ultima_entrada: agora });
    if (error) return showAlert('alert-reg', 'error', 'Erro ao registar: ' + error.message);

    limparFormulario();
    loadStats();
    showAlert('alert-reg', 'success', 'Registo efectuado com sucesso! ' + nome + ' esta agora registado como membro ' + tipo + '.');
  }

  function limparFormulario() {
    document.getElementById('reg-nome').value = '';
    document.getElementById('reg-email').value = '';
    tipoSelected = null;
    document.getElementById('opt-anual').className = 'radio-option';
    document.getElementById('opt-diario').className = 'radio-option';
  }

  async function pesquisar() {
    const email = document.getElementById('search-email').value.trim().toLowerCase();
    if (!email) return showAlert('alert-search', 'error', 'Insere um email para pesquisar.');
    const container = document.getElementById('search-result');
    container.innerHTML = '<div class="loading">A pesquisar...</div>';
    const { data, error } = await db.from('membros').select('*').eq('email', email).order('primeira_entrada', { ascending: false });
    if (error || !data || data.length === 0) {
      container.innerHTML = '<div class="alert alert-info show" style="margin-top:1rem">Nenhum membro encontrado com o email <strong>' + email + '</strong>.</div>';
      return;
    }
    container.innerHTML = data.map(m => '<div class="search-result-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.8rem;"><div><h4>' + m.nome + '</h4><p style="font-size:0.82rem;color:var(--text-light)">' + m.email + '</p></div><span class="tag tag-' + m.tipo + '">' + m.tipo + '</span></div><div class="entries-list"><div class="entries-title">Total de entradas: ' + m.entradas + '</div><div class="entry-row"><span>Primeira entrada</span><span>' + formatDate(m.primeira_entrada) + '</span></div><div class="entry-row"><span>Última entrada</span><span>' + formatDate(m.ultima_entrada) + '</span></div></div></div>').join('');
  }

  function setFilter(tipo) {
    filterTipo = tipo;
    ['todos','anual','diario'].forEach(t => document.getElementById('fbtn-' + t).classList.toggle('active', t === tipo));
    renderLista();
  }

  async function loadAndRenderLista() {
    document.getElementById('members-list').innerHTML = '<div class="loading">A carregar...</div>';
    await loadStats();
    const { data } = await db.from('membros').select('*').order('ultima_entrada', { ascending: false });
    allMembers = data || [];
    renderLista();
  }

  function renderLista() {
    const query = (document.getElementById('filter-input')?.value || '').toLowerCase();
    let filtered = allMembers.filter(m => {
      const matchTipo = filterTipo === 'todos' || m.tipo === filterTipo;
      const matchQuery = !query || m.nome.toLowerCase().includes(query) || m.email.toLowerCase().includes(query);
      return matchTipo && matchQuery;
    });
    document.getElementById('member-count').textContent = filtered.length + ' membro(s)';
    const list = document.getElementById('members-list');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><span>📋</span>Nenhum membro encontrado.</div>';
      return;
    }
    list.innerHTML = filtered.map(m => '<div class="member-card"><div class="member-info"><h4>' + m.nome + '</h4><p>' + m.email + '</p><small>Última entrada: ' + formatDate(m.ultima_entrada) + ' · ' + m.entradas + ' entrada(s)</small></div><span class="tag tag-' + m.tipo + '">' + m.tipo + '</span></div>').join('');
  }

  init();
</script>
</body>
